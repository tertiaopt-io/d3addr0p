<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AIM13 verification</title>
<link rel="stylesheet" href="../src/skin/tokens.css" />
<link rel="stylesheet" href="../src/skin/transmit.css" />
<link rel="stylesheet" href="../src/skin/chrome.css" />
</head>
<body>
<div id="root"></div>
<script type="module">
  import { renderShell } from '../dist/app.js';
  // A conversation with MANY messages, exercising bold, italic, underline, and all seven size levels,
  // so we can check: (bug 3) the window stays inside the viewport and the log scrolls; (1b) bold reads
  // clearly heavier; (1c) the size steps render distinctly; (1a) the lifetime dropdown says "Never (revocable)".
  const dur = { kind: 'duration', seconds: 86400 };
  const log = [];
  for (let i = 0; i < 28; i++) {
    log.push({
      kind: 'message',
      sender: i % 2 ? 'RAVEN' : 'you',
      text:
        `msg ${i}: plain *this is bold* then _italic_ then [u]underline[/u] · ` +
        `[z:1]s1[/z][z:2]s2[/z][z:3]s3[/z] normal [z:5]l1[/z][z:6]l2[/z][z:7]l3[/z]`,
      lifetime: dur,
      remainingSeconds: null,
    });
  }
  const view = {
    kind: 'conversation',
    transmit: { secure: true, peer: 'RAVEN', fingerprint: 'AB12CD34', log, compose: '', conversationId: 'c1' },
  };
  const root = document.getElementById('root');
  root.className = 'dd-desk';
  root.innerHTML = renderShell(view, []);
  // Pin the log to the bottom, exactly as the app's render() now does.
  const logEl = root.querySelector('.dd-log');
  if (logEl) logEl.scrollTop = logEl.scrollHeight;
  // Expose a couple of measured facts for quick assertion from the test harness.
  window.__aim13 = () => {
    const win = root.querySelector('.dd-window');
    const lg = root.querySelector('.dd-log');
    const bold = root.querySelector('.dd-msg strong');
    const s1 = root.querySelector('font[size="1"]');
    const l3 = root.querySelector('font[size="7"]');
    return {
      viewportH: window.innerHeight,
      windowH: win ? Math.round(win.getBoundingClientRect().height) : null,
      windowWithinViewport: win ? win.getBoundingClientRect().bottom <= window.innerHeight + 1 : null,
      logScrollable: lg ? lg.scrollHeight > lg.clientHeight + 2 : null,
      boldWeight: bold ? getComputedStyle(bold).fontWeight : null,
      size1px: s1 ? Math.round(parseFloat(getComputedStyle(s1).fontSize)) : null,
      size7px: l3 ? Math.round(parseFloat(getComputedStyle(l3).fontSize)) : null,
      neverLabel: root.innerHTML.includes('Never (revocable)'),
      neverExpiresGone: !root.innerHTML.includes('Never expires'),
    };
  };
</script>
</body>
</html>
